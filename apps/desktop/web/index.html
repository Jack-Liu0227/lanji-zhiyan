<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>览籍智研</title>
<script>
/* 标题带上构建戳：启动器靠它认出「哪扇窗是这一版」（app 窗口的 --app 复用不可靠） */
document.title = "览籍智研 · v" + (new URLSearchParams(location.search).get("v") || "dev");
</script>
<link rel="stylesheet" href="/app.css">
<style>#splash.ready{opacity:1;pointer-events:auto}</style>
</head>
<body>
<!-- 开始卡片：动态入场（山水背景 + 浮动主角 + 书法字 + 交互进入按钮） -->
<div id="splash" class="pywebview-drag-region">
  <div class="sp-stage" id="spStage">
    <!-- 纯净山水画卷底图（background.png） -->
    <img src="/background.png" alt="背景" class="sp-layer sp-bg" draggable="false">

    <!-- 科技微粒流动光效画布 -->
    <canvas id="spParticles" class="sp-particles"></canvas>

    <!-- 浮动主角：读书机器人徽标卡片（logo.png） -->
    <div class="sp-hero-wrap" id="spHeroWrap">
      <img src="/logo_badge.png" alt="标志" class="sp-hero-img" draggable="false">
    </div>

    <!-- 书法字标题 + 扫光 + 旋转星辉 -->
    <div class="sp-title-wrap" id="spTitleWrap">
      <div class="sp-title-box">
        <img src="/title.png" alt="览籍智研" class="sp-title-img" draggable="false">
        <div class="sp-title-shimmer"></div>
      </div>
      <img src="/star.png" alt="星标" class="sp-star" draggable="false">
    </div>

    <!-- 动态进入交互按钮：声纳脉冲波 + 渐变边框 + 浮雕箭头 -->
    <div class="sp-btn-anchor" id="spBtnAnchor">
      <div class="sp-btn-pulse"></div>
      <div class="sp-btn-pulse sp-pulse-delay"></div>
      <button id="spGo" class="sp-go-btn" type="button" title="进入主页面 (Enter)" aria-label="进入">
        <span class="sp-btn-content">
          <span class="sp-btn-txt">进 入</span>
          <svg class="sp-btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </span>
        <!-- 保持对原有自动化测试的兼容性 -->
        <span class="sp-in" style="display:none"><span class="sp-dot"></span><span class="sp-lb">Enter</span></span>
        <span class="sp-hv" style="display:none"><span>Enter</span></span>
      </button>
    </div>

    <!-- 瞬间跃迁冲击波 -->
    <div class="sp-shockwave" id="spShockwave"></div>
  </div>

  <canvas id="spGlobe" class="sp-globe"></canvas>
  <canvas id="spWord" class="sp-word"></canvas>
  <button id="spClose" class="sp-close" type="button" title="关闭">✕</button>
</div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="content">
    <header class="topbar pywebview-drag-region" id="topbar"></header>
    <div class="tabsbar" id="tabsbar"></div>
    <div class="body"><main class="main" id="main"></main></div>
    <footer class="statusbar" id="statusbar"></footer>
  </div>
</div>

<!-- 个人资料弹窗（只留常用字段；其余信息不显示） -->
<div id="profileModal" class="modal hidden">
  <div class="modal-mask"></div>
  <div class="modal-dialog" style="width:400px">
    <div class="modal-head"><h3>个人资料</h3><button class="modal-close" id="btnProfClose">✕</button></div>
    <div class="modal-body">
      <label class="field"><span>用户名（显示名）</span><input id="profName" class="tb-input" style="width:100%" placeholder="例如：姚同学"></label>
      <label class="field"><span>头像 Emoji</span><input id="profAvatar" class="tb-input" style="width:100%" placeholder="🎓" maxlength="4"></label>
      <label class="field"><span>头像照片（选了照片就优先用它，Emoji 留着备着）</span>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input type="file" id="profPhotoFile" accept="image/*" style="display:none">
          <button type="button" class="btn ghost" id="btnProfPhotoPick">＋ 上传照片</button>
          <button type="button" class="btn ghost" id="btnProfPhotoClear">恢复默认（🎓）</button>
          <img id="profPhotoPrev" class="prof-photo-prev" alt="">
        </div></label>
      <label class="field"><span>专业方向</span><input id="profField" class="tb-input" style="width:100%" placeholder="如：材料科学与工程"></label>
    </div>
    <div class="modal-foot">
      <button id="btnProfSave" class="btn btn-primary">保存</button>
      <button id="btnProfCancel" class="btn">取消</button>
    </div>
  </div>
</div>

<div id="zoteroModal" class="modal hidden">
  <div class="modal-mask"></div>
  <div class="modal-dialog modal-wide">
    <div class="modal-head"><h3>从 Zotero 取文献</h3><button class="modal-close" id="btnZotClose">✕</button></div>
    <div class="modal-body">
      <p class="modal-desc" id="zotStatus">正在连接 Zotero…</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <select id="zotCollection" class="control" style="max-width:260px"></select>
        <input id="zotQuery" class="control" placeholder="搜索标题 / 作者 / 标签" style="max-width:260px">
        <button class="btn ghost" id="zotSearch">搜索</button>
        <button class="btn btn-primary" id="zotToProject" title="把当前分类的题录 + 本机 PDF 直接放进这个项目的「下载精读」队列：不联网、不下载、不复制文件">导入项目队列</button>
        <span class="hint" id="zotCount"></span>
      </div>
      <div id="zotList" class="md-note-list" style="max-height:44vh;overflow:auto"></div>
    </div>
  </div>
</div>

<!-- 全局命令面板 (Command Palette - Ctrl+K) -->
<div id="cmdPaletteModal" class="modal hidden">
  <div class="modal-mask" id="cmdPaletteMask"></div>
  <div class="modal-dialog cmd-palette-dialog">
    <div class="cmd-palette-head">
      <span class="cmd-palette-ico">⚡</span>
      <input id="cmdPaletteInput" class="cmd-palette-input" placeholder="输入命令、跳转步骤、搜索模块或项目… (Esc 退出)" autocomplete="off">
      <span class="cmd-palette-badge">Ctrl+K</span>
    </div>
    <div class="cmd-palette-body" id="cmdPaletteResults" role="listbox"></div>
    <div class="cmd-palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 导航</span>
      <span><kbd>Enter</kbd> 执行</span>
      <span><kbd>Esc</kbd> 关闭</span>
      <span><kbd>Alt+1..0</kbd> 工作流直达</span>
    </div>
  </div>
</div>

<!-- Diff 对比与双向合并面板 (Diff Review Studio) -->
<div id="diffModal" class="modal hidden">
  <div class="modal-mask" id="diffModalMask"></div>
  <div class="modal-dialog modal-wide diff-dialog">
    <div class="modal-head">
      <h3><span id="diffModalTitle">正文变更对比与双向合并</span></h3>
      <button class="modal-close" id="btnDiffClose">✕</button>
    </div>
    <div class="modal-body diff-modal-body">
      <div class="diff-stats" id="diffStats"></div>
      <div class="diff-split-view" id="diffContainer"></div>
    </div>
    <div class="modal-foot">
      <button id="btnDiffAccept" class="btn btn-primary">全部接受变更 (Accept)</button>
      <button id="btnDiffReject" class="btn ghost">拒绝建议并保留原版 (Reject)</button>
      <button id="btnDiffCancel" class="btn">关闭</button>
    </div>
  </div>
</div>

<script src="/vendor/splash.js"></script>
<script src="/vendor/kb3d.js"></script>
<script src="/vendor/starmap.js"></script>
<script src="/vendor/lunar/lunar.js"></script>
<script src="/vendor/pdfjs/pdf.min.js"></script>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/vendor/starmap.css">
<script src="/vendor/marked/marked.umd.js"></script>
<script src="/vendor/dompurify/purify.min.js"></script>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/app-core.js"></script>
<script src="/chat-views.js"></script>
<script src="/workflow-view.js"></script>
<script src="/mail-view.js"></script>
<script src="/starmap-view.js"></script>
<script src="/notes-and-settings.js"></script>
<script src="/paper-translation.js"></script>
<script src="/diff-viewer.js"></script>
<script src="/agent-settings.js"></script>
<script src="/capabilities.js"></script>
<script src="/workflow-layout.js"></script>
<script src="/integrations-settings.js"></script>
<script src="/platform-nav.js"></script>
<script src="/project-space.js"></script>
</body>
</html>
